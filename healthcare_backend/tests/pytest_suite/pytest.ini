[pytest]
DJANGO_SETTINGS_MODULE = config.settings
pythonpath = .
testpaths = tests
python_files = test_*.py
addopts =
    -ra
    --strict-markers
    --strict-config
    --durations=5
# D: = only set when not already defined. Only SECRET_KEY gets a fallback so the
# suite starts without a .env file; DB credentials are deliberately NOT defaulted
# because tests must run against the same engine (PostgreSQL) as production.
env =
    D:SECRET_KEY=test-only-secret-key-not-used-in-production
markers =
    unit: fast, isolated tests of a single module (no HTTP round-trips)
    api: HTTP-level tests that exercise one endpoint through the full DRF stack
    integration: multi-step, multi-user scenarios across several endpoints
filterwarnings =
    error::DeprecationWarning:apps.*
    error::RuntimeWarning
